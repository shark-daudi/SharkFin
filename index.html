<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🦈 SharkFin Diary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🦈 SharkFin Diary</h1>

  <div class="container">
    <div class="form">
      <input type="text" id="title" placeholder="Event Title">
      <textarea id="desc" placeholder="Event Description"></textarea>
      <input type="datetime-local" id="datetime">
      <button id="addBtn">Add Event</button>
    </div>

    <h2>Your Events</h2>
    <ul id="eventList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
