<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharkFin Diary 🦈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🦈 SharkFin Diary</h1>

    <!-- Add / Edit Event Form -->
    <div class="event-form">
      <input type="text" id="title" placeholder="Event Title">
      <textarea id="description" placeholder="Event Description"></textarea>
      <input type="datetime-local" id="datetime">
      <button id="saveBtn">Save Event</button>
      <button id="updateBtn" class="hidden">Update Event</button>
    </div>

    <!-- Search Bar -->
    <input type="text" id="searchBar" placeholder="Search events...">

    <!-- Event List -->
    <div id="eventList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
